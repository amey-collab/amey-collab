name: Update Profile

on:
  schedule:
    - cron: "0 * * * *"          # every hour
  workflow_dispatch:              # manual "Run workflow" button
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  graphics:
    name: Activity graph + 3D skyline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          # Optional: add a PAT (read:user scope) as secret GH_PAT to include private contributions
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: amey-collab
        run: |
          python scripts/gen_activity_graph.py
          python scripts/gen_3d_skyline.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh profile graphics"
            git pull --rebase
            git push
          fi

  snake:
    name: Neon contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: amey-collab
          outputs: |
            dist/snake-neon.svg?color_snake=#00f5ff&color_dots=#2a1a55,#0097b8,#00f5ff,#b967ff,#ff00ff

      - uses: crazy-max/ghaction-github-pages@v3.5.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
